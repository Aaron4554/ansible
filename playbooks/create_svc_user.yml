- name: Create rocannon-svc
  hosts: all
  become: true
  tasks:
    - name: Create user
      user:
        name: rocannon_svc
        shell: /bin/bash
        create_home: yes

    - name: Add SSH key
      authorized_key:
        user: rocannon_svc
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Install sudo - Debian
      apt:
        name: sudo
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Restrict sudo - Debian family
      copy:
        dest: /etc/sudoers.d/rocannon_svc
        content: |
          rocannon_svc ALL=(ALL) NOPASSWD: /usr/bin/apt, /usr/bin/apt-get 
      when: ansible_os_family == "Debian"

    - name: Restrict sudo - RHEL family
      copy:
        dest: /etc/sudoers.d/rocannon_svc
        content: |
          rocannon_svc ALL=(ALL) NOPASSWD: /usr/bin/dnf, /usr/bin/dnf yum
      when: ansible_os_family == "RedHat"
